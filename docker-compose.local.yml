# The production image built from this checkout and run on this desk, so a
# change to the Dockerfile or the runtime layout is seen before it ships.
# docker-compose.yml beside it is the production deployment.
# README § "The container" describes how to run it.
name: timeline-local

services:
  timeline:
    build: .
    image: timeline:local
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      - ./data:/app/data
