name: timeline

services:
  timeline:
    # The release writes the digest it pushed into this line, and the host runs
    # that copy from timeline/deploy:sha-<12>. A floating tag here would name no
    # one image, so the line carries none.
    image: ghcr.io/datapointchris/timeline
    container_name: timeline
    restart: unless-stopped
    ports:
      - '80:3000'
    env_file: /etc/timeline/.env
    # The host's OTLP collector listens on the Docker bridge, which host-gateway names.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
    volumes:
      - /var/db/timeline:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
