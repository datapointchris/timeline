name: Redeploy (Manual)

on:
  workflow_dispatch:

# Manual redeploy trigger.
#
# Normal deploys: push to main → docker-publish.yml builds and pushes image to ghcr.io →
# GitHub fires `workflow_run.completed` → the deployment's webhook receiver
# accepts it and runs `docker compose pull && up -d` on the production host.
#
# This workflow is for "redeploy whatever is currently :latest on ghcr.io
# without making a new commit". Useful after a manual image push, or to
# restart the stack on the production host. It does not rebuild — it only fires
# the webhook so the host pulls the current :latest image and restarts the
# container.
#
# The payload names docker-publish.yml as its workflow. The receiver refuses
# any other path, which keeps the generated CI's completion from deploying.

jobs:
  redeploy:
    name: Trigger redeploy
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger deploy webhook
        run: |
          PAYLOAD="{\"action\":\"completed\",\"workflow_run\":{\"id\":${{ github.run_id }},\"path\":\".github/workflows/docker-publish.yml\",\"conclusion\":\"success\",\"head_branch\":\"main\"},\"repository\":{\"full_name\":\"${{ github.repository }}\",\"name\":\"timeline\"}}"
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac '${{ secrets.WEBHOOK_SECRET }}' | cut -d' ' -f2)
          curl --fail -X POST https://hooks.ichrisbirch.com/hooks/timeline \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
