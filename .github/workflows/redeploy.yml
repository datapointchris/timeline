name: Redeploy (Manual)

on:
  workflow_dispatch:

# Sends the deploy receiver the release of the commit it is dispatched on
# again, with no new commit.
#
# A push to main runs docker-publish.yml, which pushes the image and the deploy
# directory `timeline/deploy:sha-<12>` to ghcr.io. GitHub then sends
# `workflow_run.completed`, and the receiver deploys it on the production host.
# It reads the run's conclusion to decide, and the run's head commit to name
# the release.
#
# So this sends the receiver what GitHub sent for the newest finished
# docker-publish.yml run of this commit: that run's id, conclusion, branch and
# head commit. It rebuilds nothing. A commit with no finished run fails here,
# naming it.
#
# The payload names docker-publish.yml as its workflow. The receiver refuses
# any other path, which keeps the generated CI's completion from deploying.

permissions:
  contents: read

jobs:
  redeploy:
    name: Trigger redeploy
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    steps:
      - name: Find this commit's newest finished publish run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # The token reaches curl on stdin, never on its command line.
        run: |
          runs=$(curl -fsSL -H @- -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=1" \
            <<<"Authorization: Bearer ${GH_TOKEN}")
          run=$(jq -c '.workflow_runs[0] // empty | {id, conclusion, head_branch, head_sha}' <<<"$runs")
          if [ -z "$run" ]; then
            echo "::error::${GITHUB_SHA} has no finished docker-publish.yml run, so it has no release to deploy again"
            exit 1
          fi
          echo "Publish run: ${run}"
          echo "run=${run}" >>"$GITHUB_OUTPUT"

      - name: Trigger deploy webhook
        env:
          RELEASE_RUN: ${{ steps.release.outputs.run }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        # The key stays out of the script text and off every command line, where the
        # runner's process table would show it. perl reads it from the environment.
        run: |
          PAYLOAD=$(jq -cn --argjson run "$RELEASE_RUN" --arg repo "$GITHUB_REPOSITORY" \
            '{action: "completed", workflow_run: ($run + {path: ".github/workflows/docker-publish.yml"}), repository: {full_name: $repo, name: "timeline"}}')
          SIGNATURE=$(printf '%s' "$PAYLOAD" | perl -MDigest::SHA=hmac_sha256_hex -e 'local $/; print hmac_sha256_hex(<STDIN>, $ENV{WEBHOOK_SECRET})')
          curl --fail -X POST https://hooks.ichrisbirch.com/hooks/timeline \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
