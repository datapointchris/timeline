version: '3'

# Three npm workspaces — client, server, shared — plus a local container and
# drizzle migrations, none of which npm reaches.
#
# Every JS verb delegates to the root package.json script rather than
# reimplementing the workspace fan-out. package.json stays the one place a
# command is written; this file is the index of what can be run.

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The npm
  # install runs at the root because that is where the lockfile and the three
  # workspaces are.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - npm ci

  dev:
    desc: Run the client and server together
    cmds:
      - npm run dev

  lint:
    desc: Lint, check formatting and type check every workspace, writing nothing
    cmds:
      - npm run lint
      - npm run format:check
      - task: typecheck

  format:
    desc: Apply the lint autofixes, then format every workspace
    cmds:
      - npm run lint:fix
      - npm run format

  typecheck:
    desc: Type check every workspace
    cmds:
      - npm run typecheck

  test:
    desc: Run the server test suite
    cmds:
      - npm run test

  build:
    desc: Build every workspace
    cmds:
      - npm run build

  db:generate:
    desc: Generate a drizzle migration from the current schema
    # Never `drizzle-kit push`: it skips the __drizzle_migrations ledger, so the
    # next deploy re-applies every migration and fails.
    dir: server
    cmds:
      - npm run db:generate

  db:seed:
    desc: Seed the development database
    dir: server
    cmds:
      - npm run db:seed

  # The root docker-compose.yml is the production deployment, so these name the
  # local file. Its logs are `docker compose -f docker-compose.local.yml logs -f`.
  container:start:
    desc: Build the image from this checkout and run it on :3000 until healthy
    preconditions:
      - sh: test -f .env
        msg: 'No .env at the repo root. Copy .env.example to .env.'
    cmds:
      - docker compose -f docker-compose.local.yml up -d --build --wait

  container:stop:
    desc: Stop the local container
    cmds:
      - docker compose -f docker-compose.local.yml down
